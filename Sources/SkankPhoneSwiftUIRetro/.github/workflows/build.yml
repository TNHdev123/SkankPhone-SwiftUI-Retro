name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode Project
        run: swift package generate-xcodeproj

      - name: Build Xcode Project
        run: |
          xcodebuild clean build \
            -project "SkankPhoneSwiftUIRetro.xcodeproj" \
            -scheme "SkankPhoneSwiftUIRetro" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=build

      - name: Package to IPA
        run: |
          mkdir -p Payload
          mv build/SkankPhoneSwiftUIRetro.app Payload/
          zip -r SkankPhoneSwiftUIRetro.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkankPhoneSwiftUIRetro-IPA
          path: SkankPhoneSwiftUIRetro.ipa
