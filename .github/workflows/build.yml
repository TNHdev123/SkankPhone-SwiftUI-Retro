name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 修正：直接將 --sdk 傳畀 swift build，避免 SPM 退回使用 macOS SDK
      - name: Build with Swift Compiler
        run: |
          swift build -c release \
            --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -Xswiftc "-target" -Xswiftc "arm64-apple-ios15.0"

      - name: Package to IPA
        run: |
          mkdir -p Payload/SkankPhoneSwiftUIRetro.app
          
          # 尋找編譯出嚟嘅執行檔二進位碼
          EXEC_FILE=$(find .build -type f -name "SkankPhoneSwiftUIRetro" | head -n 1)
          echo "成功找到二進位執行檔：$EXEC_FILE"
          
          # 複製執行檔入 .app 資料夾
          cp "$EXEC_FILE" Payload/SkankPhoneSwiftUIRetro.app/SkankPhoneSwiftUIRetro
          
          # 建立 Info.plist 呃過 iOS 系統
          cat << 'EOF' > Payload/SkankPhoneSwiftUIRetro.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.retro.SkankPhoneSwiftUIRetro</string>
              <key>CFBundleName</key>
              <string>SkankPhoneSwiftUIRetro</string>
              <key>CFBundleExecutable</key>
              <string>SkankPhoneSwiftUIRetro</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleSupportedPlatforms</key>
              <array>
                  <string>iPhoneOS</string>
              </array>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

          # 打包成 IPA
          zip -r SkankPhoneSwiftUIRetro.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkankPhoneSwiftUIRetro-IPA
          path: SkankPhoneSwiftUIRetro.ipa
