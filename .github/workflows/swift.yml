name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Swift Package for iOS
        run: |
          swift build -c release --triple arm64-apple-ios

      - name: Package to IPA
        run: |
          mkdir -p Payload/SkankPhoneSwiftUIRetro.app
          
          # 將編譯好嘅執行檔複製到 .app 套件中
          cp .build/arm64-apple-ios/release/SkankPhoneSwiftUIRetro Payload/SkankPhoneSwiftUIRetro.app/SkankPhoneSwiftUIRetro
          
          # 建立必要的 Info.plist 讓 iOS 識別
          cat << 'EOF' > Payload/SkankPhoneSwiftUIRetro.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.retro.SkankPhoneSwiftUIRetro</string>
              <key>CFBundleName</key>
              <string>SkankPhoneSwiftUIRetro</string>
              <key>CFBundleExecutable</key>
              <string>SkankPhoneSwiftUIRetro</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleSupportedPlatforms</key>
              <array>
                  <string>iPhoneOS</string>
              </array>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

          # 壓縮成 IPA
          zip -r SkankPhoneSwiftUIRetro.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkankPhoneSwiftUIRetro-IPA
          path: SkankPhoneSwiftUIRetro.ipa
